<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="thumb-sample-title thumb-sample-desc">
  <title id="thumb-sample-title">포모도로 집중 타이머 샘플 앱 썸네일</title>
  <desc id="thumb-sample-desc">25분 집중 타이머 진행 링과 12개 눈금이 배치된 내장 앱 미리보기 그래픽</desc>
  <defs>
