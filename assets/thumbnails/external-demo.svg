<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="thumb-ext-title thumb-ext-desc">
  <title id="thumb-ext-title">외부 배포 웹앱 예시 썸네일</title>
  <desc id="thumb-ext-desc">외부 GitHub Pages 라이브 웹앱을 연결하는 브라우저 프레임 미리보기 그래픽</desc>
  <defs>
    <linearGradient id="ext-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="ext-glow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ext-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="ext-window-clip">
      <rect x="140" y="75" width="520" height="300" rx="18"/>
    </clipPath>
    <pattern id="ext-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <g id="background-grid">
    <rect width="800" height="450" fill="url(#ext-bg)"/>
    <rect width="800" height="450" fill="url(#ext-dots)"/>
    <rect width="800" height="450" fill="url(#ext-glow)"/>
  </g>

  <g id="primary-subject">
    <g clip-path="url(#ext-window-clip)">
      <rect x="140" y="75" width="520" height="300" fill="#0f172a"/>
      <rect x="140" y="75" width="520" height="42" fill="#1e293b"/>
      <line x1="140" y1="117" x2="660" y2="117" stroke="#334155" stroke-width="1"/>
      <circle cx="174" cy="96" r="6" fill="#f87171"/>
      <circle cx="196" cy="96" r="6" fill="#fbbf24"/>
      <circle cx="218" cy="96" r="6" fill="#34d399"/>
      <rect x="256" y="85" width="240" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    </g>
    <rect x="140" y="75" width="520" height="300" rx="18" fill="none" stroke="url(#ext-stroke)" stroke-width="2"/>
  </g>

  <g id="foreground-accents">
    <rect x="180" y="148" width="210" height="24" rx="6" fill="#818cf8"/>
    <rect x="180" y="190" width="440" height="12" rx="4" fill="#475569"/>
    <rect x="180" y="214" width="340" height="12" rx="4" fill="#334155"/>
    <rect x="180" y="246" width="212" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="408" y="246" width="212" height="52" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="180" y="314" width="148" height="38" rx="10" fill="#4f46e5"/>
    <text x="254" y="339" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GITHUB LIVE</text>
  </g>
</svg>
