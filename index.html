<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>윤선생 App Studio</title>
  <meta name="description" content="교육용 및 일상생활을 위한 웹앱 공유 플랫폼" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="윤선생 App Studio" />
  <meta property="og:description" content="교육용 및 일상생활을 위한 웹앱 공유 플랫폼" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script defer src="./data/apps.js"></script>
  <script defer src="./js/state.js"></script>
  <script defer src="./js/render.js"></script>
  <script defer src="./js/viewer.js"></script>
  <script defer src="./js/recommender.js"></script>
  <script defer src="./js/github-sync.js"></script>
  <script defer src="./js/admin.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div class="page-shell">
    <header id="site-header" class="site-header"></header>

    <main id="main-content" class="portfolio-main">
      <div id="draft-banner" class="draft-banner" hidden></div>

      <section class="controls-bar" aria-label="웹앱 검색 및 필터">
        <div class="controls-top">
          <div class="search-field">
            <label for="search-input" class="sr-only">웹앱 검색</label>
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <input
              id="search-input"
              class="search-input"
              type="search"
              placeholder="앱 이름, 목적, 추천 대상, 태그 검색..."
              autocomplete="off"
            />
          </div>

          <div class="launch-filter-group" role="group" aria-label="실행 방식 필터">
            <button type="button" class="launch-filter-btn is-active" data-launch-filter="all" aria-pressed="true">전체</button>
            <button type="button" class="launch-filter-btn" data-launch-filter="embedded" aria-pressed="false">직접 탑재</button>
            <button type="button" class="launch-filter-btn" data-launch-filter="external" aria-pressed="false">웹 링크</button>
          </div>
        </div>

        <div class="controls-bottom">
          <div id="tag-filters" class="tag-filters" aria-label="태그 필터"></div>
          <p id="apps-count" class="apps-count" aria-live="polite"></p>
        </div>
      </section>

      <section class="showcase-section" aria-label="웹앱 쇼케이스">
        <div id="app-grid" class="app-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-note">Built with pure HTML, CSS &amp; Vanilla JS · 각 웹앱 카드에서 목적·추천 대상·사용법을 확인하고 바로 실행할 수 있습니다.</p>
    </footer>
  </div>

  <div id="detail-modal" class="detail-modal" hidden aria-hidden="true"></div>

  <div id="admin-modal" class="modal-overlay" hidden aria-hidden="true"></div>

  <div
    id="viewer-overlay"
    class="viewer-overlay"
    hidden
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="viewer-app-title"
  >
    <header class="viewer-toolbar">
      <div class="viewer-toolbar-left">
        <button id="viewer-back" type="button" class="viewer-btn viewer-back-btn">← 상세로</button>
        <h2 id="viewer-app-title" class="viewer-app-title"></h2>
      </div>

      <div class="viewer-toolbar-right">
        <div class="viewer-device-group" role="group" aria-label="미리보기 화면 크기">
          <button id="viewer-device-desktop" type="button" class="viewer-device-btn is-active" aria-pressed="true">데스크톱</button>
          <button id="viewer-device-mobile" type="button" class="viewer-device-btn" aria-pressed="false">모바일</button>
        </div>
        <button id="viewer-copy-share" type="button" class="viewer-btn">공유 링크 복사</button>
        <a id="viewer-open-external" class="viewer-btn viewer-external-link" target="_blank" rel="noopener noreferrer">새 탭으로 열기</a>
        <button id="viewer-close" type="button" class="viewer-btn viewer-close-btn" aria-label="뷰어 닫기">닫기</button>
      </div>
    </header>

    <div class="viewer-hint" role="note">화면이 표시되지 않으면 '새 탭으로 열기'를 눌러주세요</div>

    <div class="viewer-stage-wrap">
      <div id="viewer-stage" class="viewer-frame-stage">
        <iframe
          id="viewer-iframe"
          class="viewer-iframe"
          src="about:blank"
          loading="eager"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
